app = "adt-speech-studio"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"
  APP_ORIGIN = "https://adt-speech-studio.fly.dev"
  PUBLIC_WEB_URL = "https://elasticsounds.github.io/adt-speech-studio/"
  SERVICE_DAILY_CHARACTERS = "0"
  SERVICE_GLOBAL_DAILY_CHARACTERS = "0"
  MAX_OWNER_BYTES = "2147483648"
  MAX_STORAGE_BYTES = "7516192768"
  MAX_CONCURRENT_JOBS = "3"
  MAX_ACCOUNTS = "1000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 30
    hard_limit = 60
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "speech_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
